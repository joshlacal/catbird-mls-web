# Keep C/C++ build scripts from assuming a toolchain-specific llvm-ar path.
# `cc` falls back to the platform archiver named here when building the
# sqlite-wasm-rs C amalgamation for wasm32.
[target.wasm32-unknown-unknown]
ar = "ar"

# `cc` does not consume Cargo's target `ar` key.  Export its target-specific
# override through Cargo so this remains local to this checkout and does not
# replace an explicitly supplied AR_wasm32_unknown_unknown.
[env]
AR_wasm32_unknown_unknown = { value = "ar", force = false }
