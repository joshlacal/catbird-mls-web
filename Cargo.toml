[package]
name = "catbird-mls-web"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Universal browser WASM package for catbird-mls — any web app can consume"

[lib]
# Keep the browser package as a cdylib while also producing an rlib so
# wasm-bindgen test harnesses link sqlite-wasm-rs's C archive correctly.
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Navigator",
    "Storage",
    "DomStringList",
    "DomException",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbIndex",
    "IdbIndexParameters",
    "IdbRequest",
    "IdbKeyRange",
    "IdbCursorDirection",
    "IdbVersionChangeEvent",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "Blob",
    "BinaryType",
    "console",
]}
serde-wasm-bindgen = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
blake3 = "1"

# HTTP (uses fetch in WASM)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
] }

# OpenMLS — same versions as catbird-mls
openmls = { version = "=0.9.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["js", "extensions-draft", "fork-resolution", "draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["draft-ietf-mls-pq-ciphersuites"] }
tls_codec = "=0.5.0"

# Utilities
base64 = "0.22"
bytes = "1"
ciborium = "0.2"
serde_ipld_dagcbor = "0.6"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
labyrinth-protocol = { path = "../labyrinth/labyrinth-protocol" }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
uuid = { version = "1", features = ["v4", "js"] }
async-trait = "0.1"
tracing = "0.1"
console_error_panic_hook = "0.1"
thiserror = "1.0"

# WASM-compatible getrandom.
# getrandom 0.2 (direct) uses features = ["js"] for WASM.
# getrandom 0.3+ (pulled via hpke-rs/rand 0.9) requires the `wasm_js` feature.
# We declare both so Cargo unifies features correctly across semver-incompatible versions.
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Shared MLS orchestrator — same crate as Catbird iOS and Catmos desktop.
# Keeping this target-specific prevents native checks from pulling its
# audiopus_sys/CMake voice stack into this browser-only crate.
catbird_mls = { path = "../catbird-mls", default-features = false, features = ["browser"] }
catbird-atproto = { path = "../../dec1-w0/wave1-catbird-atproto", features = ["namespace-bluecatbird", "namespace-atproto-space"] }
atproto-spaces = { path = "../../dec1-w0/wave1-catbird-atproto/atproto-spaces", default-features = false }
# Labyrinth records, MEKs and directory for the browser archive (already in the graph via
# catbird_mls).
labyrinth = { path = "../labyrinth", features = ["space"] }
http = "1"
multibase = "0.9"
subtle = "2"
zeroize = "1"

# SQLite for WASM — raw FFI bindings with sqlite3mc encryption. Keep this out
# of native checks/tests: its OPFS VFS and C amalgamation only run in WASM.
sqlite-wasm-rs = { version = "0.6.3", default-features = false, features = ["wasm-bindgen", "sqlite3mc"] }
sqlite-wasm-vfs = { version = "0.3.0", default-features = false, features = ["sahpool"] }
rsqlite-vfs = "0.2.0"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"     # Size-optimize glue, generated types, and C SQLite in WASM
lto = true
codegen-units = 1

# Hot pure-Rust PQ/MLS/AEAD/hash inner loops keep opt-level = 3 for speed
# while non-crypto crates shrink under opt-level = "z".
[profile.release.package.aes]
opt-level = 3
[profile.release.package.aes-gcm]
opt-level = 3
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.ghash]
opt-level = 3
[profile.release.package.hkdf]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3
[profile.release.package.hpke-rs]
opt-level = 3
[profile.release.package.hpke-rs-libcrux]
opt-level = 3
[profile.release.package.hpke-rs-rust-crypto]
opt-level = 3
[profile.release.package.libcrux-aead]
opt-level = 3
[profile.release.package.libcrux-aes]
opt-level = 3
[profile.release.package.libcrux-chacha20poly1305]
opt-level = 3
[profile.release.package.libcrux-curve25519]
opt-level = 3
[profile.release.package.libcrux-ecdh]
opt-level = 3
[profile.release.package.libcrux-ed25519]
opt-level = 3
[profile.release.package.libcrux-hacl-rs]
opt-level = 3
[profile.release.package.libcrux-hkdf]
opt-level = 3
[profile.release.package.libcrux-hmac]
opt-level = 3
[profile.release.package.libcrux-kem]
opt-level = 3
[profile.release.package.libcrux-ml-kem]
opt-level = 3
[profile.release.package.libcrux-p256]
opt-level = 3
[profile.release.package.libcrux-poly1305]
opt-level = 3
[profile.release.package.libcrux-sha2]
opt-level = 3
[profile.release.package.libcrux-sha3]
opt-level = 3
[profile.release.package.ml-dsa]
opt-level = 3
[profile.release.package.ml-kem]
opt-level = 3
[profile.release.package.p256]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.sha3]
opt-level = 3
[profile.release.package.x-wing]
opt-level = 3
[profile.release.package.x25519-dalek]
opt-level = 3

[features]
inventory-worker-tests = []
